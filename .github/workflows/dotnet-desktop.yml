name: .NET Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TrustApp.sln

      - name: Build
        run: dotnet build TrustApp.sln --no-restore --configuration Release

      # No test step yet - there are no test projects in this solution. Add one
      # here (`dotnet test TrustApp.sln --no-build --configuration Release`)
      # once a test project exists, rather than leaving a step that fails
      # because there's nothing to run.
